[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "match-context"
version = "0.1.0"
description = "Synthetic football match events and bounded, explainable analysis"
requires-python = ">=3.13"
dependencies = ["pydantic==2.14.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
match-context = "match_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
